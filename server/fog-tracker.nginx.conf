# Fog Gate Tracker - nginx configuration
# Include this in your server block or copy to sites-available

# Cache-Control: revalidate static files (CSS, JS, HTML), not API/images
map $uri $fog_tracker_cache_control {
    ~*\.(css|js|html)$  "no-cache";
    default             "";
}

location /fog-tracker/ {
    proxy_pass http://127.0.0.1:8001/;
    proxy_http_version 1.1;

    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts for WebSocket
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;

    # Cache control for static files
    add_header Cache-Control $fog_tracker_cache_control;
}
