repos:
  # Python (server/)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        files: server/
      - id: ruff-format
        files: server/

  # JavaScript (web/)
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c 'cd web && npx eslint --fix "${@//web\//}"' --
        language: system
        types: [javascript]
        files: ^web/js/

      - id: prettier
        name: prettier
        entry: bash -c 'cd web && npx prettier --write "${@//web\//}"' --
        language: system
        types: [javascript]
        files: ^web/js/

  # Rust (mod/)
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: rustfmt
        language: system
        types: [rust]
        files: ^mod/
