[package]
name = "fog-rando-tracker"
version = "0.3.0"
edition = "2021"
authors = ["wospins"]
license = "AGPL-3.0"
description = "Fog Gate Randomizer tracker mod for Elden Ring"
repository = "https://github.com/rbignon/er-fog-tracker"

[lib]
# cdylib for DLL on Windows, rlib for tests
crate-type = ["cdylib", "rlib"]
name = "fog_rando_tracker"

[[bin]]
name = "fog-rando-tracker-launcher"
path = "src/launcher/main.rs"
required-features = ["launcher"]

# =============================================================================
# CROSS-PLATFORM DEPENDENCIES (work on Linux and Windows)
# =============================================================================

[dependencies]
# --- Utilities ---
num_enum = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }
once_cell = "1.19.0"
parking_lot = "0.12.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# --- WebSocket client for fog-tracker integration ---
tungstenite = { version = "0.21", features = ["native-tls"] }
crossbeam-channel = "0.5"

# --- Launcher GUI dependencies (not needed for DLL) ---
native-windows-gui = { version = "1.0.13", optional = true }
native-windows-derive = { version = "1.0.5", optional = true }
ureq = { version = "2.10", features = ["json", "tls"], optional = true }
dirs = { version = "5.0", optional = true }

# --- EMEVD parsing for launcher (DCX decompression + binary parsing) ---
flate2 = { version = "1.0", optional = true }
byteorder = { version = "1.5", optional = true }
thiserror = { version = "1.0", optional = true }

# =============================================================================
# WINDOWS-ONLY DEPENDENCIES
# =============================================================================

[target.'cfg(windows)'.dependencies]
# --- libeldenring from your fork ---
libeldenring = { git = "https://github.com/veeenu/eldenring-practice-tool", tag = "1.9.4" }

# --- hudhook for ImGui overlay (includes imgui as transitive dependency) ---
hudhook = { version = "0.7.0", features = ["dx12", "inject"], default-features = false }

# --- retour for function hooking (warp detection) ---
retour = { version = "0.3", default-features = false }

# --- Windows API ---
[target.'cfg(windows)'.dependencies.windows]
version = "0.54.0"
features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Memory",
    "Win32_System_Com",
    # For launcher config path
    "Win32_UI_Shell",
    # For launcher process monitoring
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
]

[build-dependencies]
embed-resource = "2.4"

[features]
launcher = ["native-windows-gui", "native-windows-derive", "ureq", "dirs", "flate2", "byteorder", "thiserror"]

[profile.release]
strip = "symbols"
lto = true
