# FogRandoTracker Configuration
# ==============================
#
# This file MUST be placed next to fog_rando_tracker.dll for the mod to work.

# =============================================================================
# KEYBINDINGS
# =============================================================================

[keybindings]
# Key to toggle UI visibility
toggle_ui = "f9"
# Key to fold/unfold exits list
toggle_exits = "f10"
# Key to show only undiscovered exits (filter toggle)
toggle_undiscovered_only = "shift+f10"

# Key to toggle debug info (map_id, server URL, etc.)
toggle_debug = "ctrl+f11"
# Key to upload last 5 minutes of logs to server (for debugging)
upload_logs = "ctrl+f12"

# =============================================================================
# OVERLAY SETTINGS
# =============================================================================
#
# Customize the in-game overlay appearance.
# Colors use hex format "#RRGGBB".
#
[overlay]
# Font to use for the overlay. Can be:
#   - Empty "" (default): Uses Windows system font (Segoe UI)
#   - Filename only "arial.ttf": Looks in C:\Windows\Fonts\ then DLL directory
#   - Relative path "fonts/custom.ttf": Relative to DLL directory
#   - Absolute path "C:\Fonts\MyFont.ttf": Uses the specified file
font_path = ""

# Font size in pixels (32.0 recommended for 1080p, 64.0 for 4K)
font_size = 32

# Icon size in pixels for rune_icons and kindling_icon (optional)
# If not set, uses font_size
# icon_size = 32.0

# Maximum overlay height in pixels (optional)
# If the overlay exceeds this height, the exits section font will be scaled
# down (to exits_min_font_scale). If it still doesn't fit, the exits list
# will be truncated with a "+ X others" indicator.
# If not set, no height limit is applied.
max_height = 500.0

# Minimum font scale for exits section when max_height is exceeded (0.0 to 1.0)
# Default: 0.5 (50% of original size). Below this threshold, exits are
# truncated instead of further scaled down.
# exits_min_font_scale = 0.5

# Overlay position (relative to top-right corner of the screen)
# position_offset_x: horizontal margin from the right edge (in pixels)
# position_offset_y: vertical margin from the top edge (in pixels)
# position_offset_x = 20.0
# position_offset_y = 20.0

# Background color and opacity (SpeedFog graphic-charter foundations)
background_color = "#0F1923"
background_opacity = 0.55  # 0.0 = fully transparent, 1.0 = fully opaque

# Text colors
text_color = "#E8E6E1"           # Main text
text_disabled_color = "#6B7280"  # Secondary/disabled text

# Exit colors
discovered_color = "#10B981"     # Known destinations (green)
undiscovered_color = "#9CA3AF"   # Unknown destinations "???" (gray)

# Window border
show_border = false              # Set to true to show a border
border_color = "#253550"         # Border color (only used if show_border = true)

# Status line template
# Variables:
#   {zone}         - Current zone name (or zone_unknown_text if unknown)
#   {discovered}   - Number of discovered random links
#   {total}        - Total number of random links
#   {progress}     - Discovery percentage (0-100)
#   {status}       - Server connection indicator (colored dot)
#   {map}          - Current map ID (e.g., "m60_44_36_00")
#   {deaths}       - Total death count for the character
#   {igt}          - In-game time (format: H:MM:SS)
#   {runes}        - Number of Great Runes possessed (0-7, deduplicated)
#   {rune_icons}   - Great Rune icons (colored if possessed, grayed if not)
#   {kindling}      - Number of Messmer's Kindling items
#   {kindling_icon} - Messmer's Kindling icon
#   {death_icon}    - Death icon
#   {scaling}       - Zone scaling tier (e.g., "Scaling: tier 1, previously 2")
#
# Colors (optional, add after variable name with colon):
#   {variable:color} - Apply color to the variable
#   Named colors: red, green, blue, yellow, orange, cyan, magenta, gray, white
#   Config colors: discovered, undiscovered, disabled (uses overlay colors)
#   Hex colors: #RRGGBB (e.g., #FF0000 for red)
#
# Markers:
#   $n - Newline (for multi-line status)
#   $> - Right-align the rest of the line
#
# Examples:
#   "{zone}$>{status} {discovered}/{total}"              - Zone left, stats right (default)
#   "{zone:blue}$>{status} {discovered}/{total}"         - Zone in blue
#   "{zone:discovered}$>{discovered:green}/{total}"      - Zone in discovered color, count in green
#   "{zone:#0088FF}$>{status} {discovered}/{total}"      - Zone in custom hex color
#   "{zone} | {progress}%"                               - Simple single line
#   "{zone}$n{discovered}/{total} discovered"            - Two lines
#   "{zone}$>{status} {discovered}/{total} | D:{deaths}" - With death counter
#   "{zone}$>{igt} | {deaths}D"                          - With IGT and deaths
#   "{zone}$>{runes}/7 | K:{kindling}"                   - With Great Runes and Kindling
#   "{zone}$>{rune_icons}"                               - With Great Rune icons
#   "{zone}$n{rune_icons} {discovered}/{total}"          - Two lines with rune icons
#   "{rune_icons} {kindling_icon}{kindling}"             - Rune icons + kindling icon with count
#   "{death_icon}{deaths}"                               - Death icon with count
#   "{zone}$n{scaling}$>{status} {discovered}/{total}"   - Two lines with zone scaling

status_template = "{status} {zone}$>{igt:blue}$n{scaling:yellow}$>{discovered:green}/{total}$n{rune_icons}{kindling_icon}{kindling}$>{death_icon}{deaths}"

# Text shown when zone is unknown (before first fog traversal)
zone_unknown_text = "(traverse a fog to identify)"

# =============================================================================
# LOGGING
# =============================================================================

[logging]
# Open a debug console window for real-time logging (true/false)
# Useful for troubleshooting issues with the mod.
console = false

# Log file path (relative to DLL directory or absolute). Empty = no file logging.
# Examples: "fog_tracker.log", "C:\Logs\fog_tracker.log"
log_file = ""
